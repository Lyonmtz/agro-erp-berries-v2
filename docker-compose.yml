services:
  db:
    image: postgres:16-alpine
    container_name: agro_v2_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agro_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DevPassword2026!}
      POSTGRES_DB: ${POSTGRES_DB:-agro_berries_erp}
      TZ: ${TZ:-America/Mexico_City}
    volumes:
      - postgres_v2_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agro_admin} -d ${POSTGRES_DB:-agro_berries_erp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db_test:
    image: postgres:16-alpine
    container_name: agro_v2_postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agro_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DevPassword2026!}
      POSTGRES_DB: agro_berries_erp_test
      TZ: ${TZ:-America/Mexico_City}
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./database/00_extensions.sql:/docker-entrypoint-initdb.d/00_extensions.sql:ro
      - ./database/01_schema_core_rh.sql:/docker-entrypoint-initdb.d/01_schema_core_rh.sql:ro
      - ./database/02_schema_campo_pagos.sql:/docker-entrypoint-initdb.d/02_schema_campo_pagos.sql:ro
      - ./database/03_seed_data.sql:/docker-entrypoint-initdb.d/03_seed_data.sql:ro
      - ./database/04_schema_tec_inv_log.sql:/docker-entrypoint-initdb.d/04_schema_tec_inv_log.sql:ro
      - ./database/05_schema_fase1_core_org_auth_docs.sql:/docker-entrypoint-initdb.d/05_schema_fase1_core_org_auth_docs.sql:ro
      - ./database/06_seed_fase1_org_rbac.sql:/docker-entrypoint-initdb.d/06_seed_fase1_org_rbac.sql:ro
      - ./database/07_schema_fase3a_trasplante_sync.sql:/docker-entrypoint-initdb.d/07_schema_fase3a_trasplante_sync.sql:ro
      - ./database/08_schema_fase2_rh_merqry.sql:/docker-entrypoint-initdb.d/08_schema_fase2_rh_merqry.sql:ro
      - ./database/09_schema_fase3b_cosecha_culturales_prenomina.sql:/docker-entrypoint-initdb.d/09_schema_fase3b_cosecha_culturales_prenomina.sql:ro
      - ./database_test_init/99_mark_disposable_test.sql:/docker-entrypoint-initdb.d/99_mark_disposable_test.sql:ro
    ports:
      - "${TEST_POSTGRES_HOST_PORT:-5436}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agro_admin} -d agro_berries_erp_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: agro_v2_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db_test:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://agro_admin:DevPassword2026!@db:5432/agro_berries_erp}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgresql+asyncpg://agro_admin:DevPassword2026!@db_test:5432/agro_berries_erp_test}
      ALLOW_DESTRUCTIVE_TEST_DB: ${ALLOW_DESTRUCTIVE_TEST_DB:-false}
      SECRET_KEY: ${SECRET_KEY:-DevSecretKey_Berries_2026}
      MERQRY_READONLY_MODE: "true"
      TZ: ${TZ:-America/Mexico_City}
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    ports:
      - "${BACKEND_HOST_PORT:-8001}:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_v2_data:
